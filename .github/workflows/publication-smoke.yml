name: publication-smoke
on: [push, pull_request]
jobs:
  pdf-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: python -m pip install --upgrade pip playwright pyyaml pillow
      - run: python -m playwright install --with-deps chromium
      - run: python scripts/assemble_master.py --manifest tests/sprint3/manifest.yaml --out /tmp/master.html
      - run: python scripts/render_pdf.py /tmp/master.html --out /tmp/master.pdf > /tmp/renderer-metadata.json
      - run: python scripts/html_qa.py /tmp/master.html > /tmp/html-qa.txt
      - name: Install and verify Poppler rasterizer
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends poppler-utils
          which pdftoppm
          pdftoppm -v 2>&1 | head -n 1
      - run: python scripts/rasterize_pdf.py /tmp/master.pdf --out-dir /tmp/pages
      - run: test -s /tmp/master.pdf && test -n "$(find /tmp/pages -name '*.png' -print -quit)"
      - name: Build contact sheet
        run: python scripts/contact_sheet.py /tmp/pages --out /tmp/contact-sheet.png
      - name: Upload publication artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reportflow-publication-artifacts
          path: |
            /tmp/master.pdf
            /tmp/pages/*.png
            /tmp/contact-sheet.png
            /tmp/renderer-metadata.json
            /tmp/html-qa.txt
          if-no-files-found: error
  publication-regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: python -m pip install --upgrade pip playwright pyyaml pillow pypdf
      - run: python -m playwright install --with-deps chromium
      - name: Install and verify Poppler rasterizer
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends poppler-utils
          which pdftoppm
          pdftoppm -v 2>&1 | head -n 1
      - name: Render regression fixture
        run: |
          python scripts/render_pdf.py tests/sprint3/regression-master.html --out /tmp/regression-master.pdf > /tmp/regression-renderer-metadata.json
          python scripts/html_qa.py tests/sprint3/regression-master.html > /tmp/regression-html-qa.txt
          python scripts/pdf_preflight.py /tmp/regression-master.pdf --out /tmp/regression-preflight.json
          python scripts/rasterize_pdf.py /tmp/regression-master.pdf --out-dir /tmp/regression-pages
          python scripts/contact_sheet.py /tmp/regression-pages --out /tmp/regression-contact-sheet.png
      - name: Capture rendered PDF text diagnostics
        run: python scripts/pdf_text_diagnostic.py /tmp/regression-master.pdf --out /tmp/regression-pdf-text-diagnostic.txt
      - name: Reconcile TOC against rendered headings
        run: |
          python scripts/toc_reconcile.py /tmp/regression-master.pdf --out /tmp/toc-reconciliation-report.json
          # second render after detection, then reconcile against the final PDF
          python scripts/render_pdf.py tests/sprint3/regression-master.html --out /tmp/regression-master-final.pdf > /tmp/regression-renderer-metadata-final.json
          python scripts/toc_reconcile.py /tmp/regression-master-final.pdf --out /tmp/toc-reconciliation-report-final.json
          python scripts/pdf_text_diagnostic.py /tmp/regression-master-final.pdf --out /tmp/regression-pdf-text-diagnostic-final.txt
          mv /tmp/toc-reconciliation-report-final.json /tmp/toc-reconciliation-report.json
      - name: Verify regression artifacts
        run: |
          test -s /tmp/regression-master-final.pdf
          test -n "$(find /tmp/regression-pages -name '*.png' -print -quit)"
          test -s /tmp/regression-contact-sheet.png
          test -s /tmp/toc-reconciliation-report.json
          grep -q '"toc_reconciled": true' /tmp/toc-reconciliation-report.json
      - name: Upload regression publication artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reportflow-publication-regression
          path: |
            /tmp/regression-master-final.pdf
            /tmp/regression-master.pdf
            /tmp/regression-pages/*.png
            /tmp/regression-contact-sheet.png
            /tmp/regression-renderer-metadata.json
            /tmp/regression-renderer-metadata-final.json
            /tmp/regression-html-qa.txt
            /tmp/regression-preflight.json
            /tmp/toc-reconciliation-report.json
            /tmp/regression-pdf-text-diagnostic.txt
            /tmp/regression-pdf-text-diagnostic-final.txt
          if-no-files-found: error
